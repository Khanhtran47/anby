commit-msg:
  commands:
    lint-commit-msg:
      run: pnpm commitlint --edit

pre-commit:
  parallel: true
  commands:
    lint:
      run: pnpm lint
      glob: '*.{tsx,ts,jsx,js}'
    prettier:
      run: pnpm prettier
      glob: '*.{tsx,ts,jsx,js,json,css,md}'
    typecheck:
      run: pnpm typecheck
      glob: '*.{tsx,ts}'
    unused-code:
      run: pnpm unused
